---
- name: Install required packages
  ansible.builtin.dnf:
    name:
      - wget
      - tar
    state: present

- name: Create web directory
  ansible.builtin.file:
    path: "{{ dokuwiki_dir }}"
    state: directory
    owner: "{{ dokuwiki_owner }}"
    group: "{{ dokuwiki_group }}"
    mode: '0755'

- name: Download DokuWiki
  ansible.builtin.get_url:
    url: "{{ dokuwiki_url }}"
    dest: /tmp/dokuwiki.tgz
    mode: '0644'

- name: Extract DokuWiki properly
  ansible.builtin.unarchive:
    src: /tmp/dokuwiki.tgz
    dest: "{{ dokuwiki_dir }}"
    remote_src: true
    extra_opts:
      - --strip-components=1
    creates: "{{ dokuwiki_dir }}/doku.php"

- name: Set permissions
  ansible.builtin.file:
    path: "{{ dokuwiki_dir }}"
    owner: "{{ dokuwiki_owner }}"
    group: "{{ dokuwiki_group }}"
    recurse: true

- name: Create local config
  ansible.builtin.template:
    src: local.php.j2
    dest: "{{ dokuwiki_dir }}/conf/local.php"
    owner: "{{ dokuwiki_owner }}"
    group: "{{ dokuwiki_group }}"
    mode: '0644'

- name: Create install lock
  ansible.builtin.file:
    path: "{{ dokuwiki_dir }}/conf/.install.lock"
    state: touch
    modification_time: preserve
    access_time: preserve
    mode: '0644'

- name: Fix permissions
  ansible.builtin.file:
    path: "{{ dokuwiki_dir }}"
    recurse: true
    owner: "{{ dokuwiki_owner }}"
    group: "{{ dokuwiki_group }}"

- name: Ensure correct directory name
  ansible.builtin.file:
    path: "{{ dokuwiki_dir }}"
    state: directory
    owner: "{{ dokuwiki_owner }}"
    group: "{{ dokuwiki_group }}"
    mode: '0755'

- name: Create admin user file
  ansible.builtin.copy:
    dest: "{{ dokuwiki_dir }}/conf/users.auth.php"
    content: |
      admin:$2y$10$0s.U07Ui1xIaj5y5xgYNoOC1XzqSdmI2y3rEx9p87FsfM.deXMa9S:Admin:admin@example.com:admin,user
    owner: "{{ dokuwiki_owner }}"
    group: "{{ dokuwiki_group }}"
    mode: '0644'
    force: false
